version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL 8.0 Relational Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopsphere_db
      MYSQL_USER: shopsphere
      MYSQL_PASSWORD: ShopSphere@2025
      MYSQL_ROOT_PASSWORD: RootPassword@2025
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword@2025"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopsphere-network

  # ----------------------------------------------------------------------------
  # Spring Boot 3.3.4 Backend REST API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: shopsphere
      SPRING_DATASOURCE_PASSWORD: ShopSphere@2025
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopsphere-network

  # ----------------------------------------------------------------------------
  # React + Vite + Nginx Frontend Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shopsphere-network

volumes:
  mysql_data:
    driver: local

networks:
  shopsphere-network:
    driver: bridge
