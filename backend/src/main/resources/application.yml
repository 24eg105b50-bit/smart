server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shopsphere-campus-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  cache:
    type: caffeine
    cache-names:
      - categories
      - products
      - featuredProducts

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ShopSphereCampusSuperSecureSecretKeyForJwtAuthenticationAU2024AU2026EnterpriseKey!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# AI Service Configuration
app:
  ai:
    enabled: true
    provider: ${AI_PROVIDER:local} # local, gemini, or openai
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    temperature: 0.2

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
