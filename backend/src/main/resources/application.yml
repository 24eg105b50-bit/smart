server:
  port: 8080

spring:
  application:
    name: shopsphere-campus-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopsphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  cache:
    type: caffeine
    cache-names:
      - categories
      - products
      - featuredProducts
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ShopSphereCampusSuperSecureSecretKeyForJwtAuthenticationAU2024AU2026EnterpriseKey!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  ai:
    enabled: true
    provider: ${AI_PROVIDER:local} # local, gemini, or openai
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    temperature: 0.2

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
